<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>pet</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  #stage { position: absolute; inset: 0; display: block; }
  #hud {
    position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%);
    display: flex; gap: 6px; align-items: baseline;
    padding: 3px 8px 4px; border-radius: 10px;
    max-width: calc(100% - 6px);
    background: linear-gradient(180deg, rgba(12,14,20,.34), rgba(12,14,20,.52));
    border: 1px solid rgba(255, 255, 255, .07);
    color: #f2f5fa; font-size: 10.5px; line-height: 1.15; white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .85);
    backdrop-filter: blur(3px);
    transition: opacity .25s ease, transform .25s ease, background .25s ease;
    opacity: .78;
    letter-spacing: .2px;
  }
  #hud:hover {
    opacity: 1;
    transform: translateX(-50%) translateY(-2px);
    background: linear-gradient(180deg, rgba(12,14,20,.55), rgba(12,14,20,.72));
  }
  /* 两侧细装饰线，像铭牌 */
  #hud::before, #hud::after {
    content: '';
    position: absolute; top: 50%; width: 12px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.35));
  }
  #hud::before { right: 100%; margin-right: 5px; }
  #hud::after { left: 100%; margin-left: 5px; transform: scaleX(-1); }
  .sep { width: 1px; height: 9px; background: rgba(255,255,255,.16); align-self: center; }
  .val { font-weight: 600; }
  .ok { color: #7ee2a8; }
  .warn { color: #f7c46c; }
  .bad { color: #ff9b8f; }
  .dim { color: #a9b2c3; font-size: 9.5px; }
  #dot { width: 4px; height: 4px; border-radius: 50%; background: #7ee2a8; box-shadow: 0 0 5px currentColor; align-self: center; }
  #dot.err { background: #ff9b8f; }
  #calbar {
    display: none;
    position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
    max-width: 92%; padding: 6px 12px; border-radius: 8px;
    background: rgba(40, 120, 220, .94); color: #fff;
    font-size: 11px; line-height: 1.4; text-align: center; white-space: pre-wrap;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .4);
    pointer-events: none; z-index: 10;
  }
  #calbar.on { display: block; }
  /* 找不到模型时的自救提示（可点击） */
  #empty {
    display: none;
    position: absolute; left: 12px; right: 12px; top: 50%; transform: translateY(-50%);
    padding: 14px 14px 12px; border-radius: 12px; text-align: center;
    background: linear-gradient(180deg, rgba(16,20,30,.92), rgba(16,20,30,.96));
    border: 1px solid rgba(120,170,255,.35);
    box-shadow: 0 8px 26px rgba(0,0,0,.55);
    color: #e8eefc; font-size: 11px; line-height: 1.6;
    cursor: pointer; z-index: 9;
  }
  #empty.on { display: block; }
  #empty b { display: block; font-size: 12.5px; margin-bottom: 4px; color: #9cc4ff; }
  #empty span { color: #a9b8d4; }
  #empty u { color: #7ee2a8; text-decoration: none; }
  /* 模型加载期间的轻量提示，加载完淡出 */
  #loading {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    color: rgba(255, 255, 255, .6); font-size: 11px; letter-spacing: 1.5px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .85);
    pointer-events: none; transition: opacity .35s ease;
  }
  #loading.off { opacity: 0; }
  /* 头顶气泡台词 */
  #bubble {
    position: absolute; left: 50%; top: 40%;
    transform: translate(-50%, -100%) scale(.96);
    padding: 5px 11px; border-radius: 11px;
    background: rgba(16, 20, 30, .84);
    border: 1px solid rgba(120, 170, 255, .28);
    color: #e8eefc; font-size: 11px; line-height: 1.35;
    white-space: nowrap; pointer-events: none; z-index: 8;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .5);
    opacity: 0; transition: opacity .18s ease, transform .18s ease;
  }
  #bubble.on { opacity: 1; transform: translate(-50%, -100%) scale(1); }
  #bubble::after {
    content: ''; position: absolute; left: 50%; top: 100%;
    margin-left: -5px; border: 5px solid transparent;
    border-top-color: rgba(16, 20, 30, .84);
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="calbar"></div>
<div id="loading">正在唤醒…</div>
<div id="bubble"></div>
<div id="empty" title="点击选择模型目录">
  <b>没找到 Live2D 模型</b>
  <span>点这里选 <u>assets 皮肤目录</u>，<br>或右键菜单 → 选择皮肤目录…</span>
</div>
<div id="hud" title="点击查看用量明细，右键打开菜单">
  <span id="dot"></span>
  <span class="val" id="bal">--</span>
  <span class="sep"></span>
  <span class="dim">今日</span>
  <span class="val" id="tok">--</span>
  <span class="sep"></span>
  <span class="dim" id="calls">-- 次</span>
</div>

<script src="../node_modules/pixi.js/dist/pixi.min.js"></script>
<script src="./live2dcubismcore.min.js"></script>
<script src="../node_modules/pixi-live2d-display/dist/cubism4.min.js"></script>
<script src="./renderer.js"></script>
</body>
</html>
