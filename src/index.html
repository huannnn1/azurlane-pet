<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>pet</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  #stage { position: absolute; inset: 0; display: block; }
  #hud {
    position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
    display: flex; gap: 6px; align-items: center;
    padding: 5px 10px; border-radius: 999px;
    background: rgba(18, 20, 26, .82);
    border: 1px solid rgba(255, 255, 255, .10);
    box-shadow: 0 4px 16px rgba(0, 0, 0, .32);
    color: #e9edf5; font-size: 10.5px; line-height: 1; white-space: nowrap;
    backdrop-filter: blur(6px);
    transition: opacity .25s ease;
    opacity: .92;
  }
  #hud:hover { opacity: 1; }
  .sep { width: 1px; height: 9px; background: rgba(255,255,255,.14); }
  .val { font-weight: 600; letter-spacing: .2px; }
  .ok { color: #58d68d; }
  .warn { color: #f5b041; }
  .bad { color: #ec7063; }
  .dim { color: #8b93a3; font-size: 9.5px; }
  #dot { width: 5px; height: 5px; border-radius: 50%; background: #58d68d; box-shadow: 0 0 6px currentColor; }
  #dot.err { background: #ec7063; }
  #calbar {
    display: none;
    position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
    max-width: 92%; padding: 6px 12px; border-radius: 8px;
    background: rgba(40, 120, 220, .94); color: #fff;
    font-size: 11px; line-height: 1.4; text-align: center; white-space: pre-wrap;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .4);
    pointer-events: none; z-index: 10;
  }
  #calbar.on { display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="calbar"></div>
<div id="hud" data-opaque="1" title="右键打开菜单">
  <span id="dot"></span>
  <span class="val" id="bal">--</span>
  <span class="sep"></span>
  <span class="dim">今日</span>
  <span class="val" id="tok">--</span>
  <span class="sep"></span>
  <span class="dim" id="calls">-- 次</span>
</div>

<script src="../node_modules/pixi.js/dist/pixi.min.js"></script>
<script src="./live2dcubismcore.min.js"></script>
<script src="../node_modules/pixi-live2d-display/dist/cubism4.min.js"></script>
<script src="./renderer.js"></script>
</body>
</html>
