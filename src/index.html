<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>pet</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  #stage { position: absolute; inset: 0; display: block; }
  #hud {
    position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%);
    display: flex; gap: 7px; align-items: baseline;
    padding: 3px 10px 4px; border-radius: 10px;
    background: linear-gradient(180deg, rgba(12,14,20,.34), rgba(12,14,20,.52));
    border: 1px solid rgba(255, 255, 255, .07);
    color: #f2f5fa; font-size: 10.5px; line-height: 1.15; white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .85);
    backdrop-filter: blur(3px);
    transition: opacity .25s ease, transform .25s ease, background .25s ease;
    opacity: .78;
    letter-spacing: .2px;
  }
  #hud:hover {
    opacity: 1;
    transform: translateX(-50%) translateY(-2px);
    background: linear-gradient(180deg, rgba(12,14,20,.55), rgba(12,14,20,.72));
  }
  /* 两侧细装饰线，像铭牌 */
  #hud::before, #hud::after {
    content: '';
    position: absolute; top: 50%; width: 12px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.35));
  }
  #hud::before { right: 100%; margin-right: 5px; }
  #hud::after { left: 100%; margin-left: 5px; transform: scaleX(-1); }
  .sep { width: 1px; height: 9px; background: rgba(255,255,255,.16); align-self: center; }
  .val { font-weight: 600; }
  .ok { color: #7ee2a8; }
  .warn { color: #f7c46c; }
  .bad { color: #ff9b8f; }
  .dim { color: #a9b2c3; font-size: 9.5px; }
  #dot { width: 4px; height: 4px; border-radius: 50%; background: #7ee2a8; box-shadow: 0 0 5px currentColor; align-self: center; }
  #dot.err { background: #ff9b8f; }
  #calbar {
    display: none;
    position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
    max-width: 92%; padding: 6px 12px; border-radius: 8px;
    background: rgba(40, 120, 220, .94); color: #fff;
    font-size: 11px; line-height: 1.4; text-align: center; white-space: pre-wrap;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .4);
    pointer-events: none; z-index: 10;
  }
  #calbar.on { display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="calbar"></div>
<div id="hud" data-opaque="1" title="右键打开菜单">
  <span id="dot"></span>
  <span class="val" id="bal">--</span>
  <span class="sep"></span>
  <span class="dim">今日</span>
  <span class="val" id="tok">--</span>
  <span class="sep"></span>
  <span class="dim" id="calls">-- 次</span>
</div>

<script src="../node_modules/pixi.js/dist/pixi.min.js"></script>
<script src="./live2dcubismcore.min.js"></script>
<script src="../node_modules/pixi-live2d-display/dist/cubism4.min.js"></script>
<script src="./renderer.js"></script>
</body>
</html>
