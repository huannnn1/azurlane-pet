<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>用量明细</title>
<style>
  :root {
    --bg: #10131b;
    --card: #171b26;
    --card-2: #1d2230;
    --line: rgba(255, 255, 255, .07);
    --fg: #e8eefc;
    --dim: #8a96ad;
    --accent: #9cc4ff;
    --good: #7ee2a8;
    --warn: #f7c46c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    font-size: 12px; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  body { display: flex; flex-direction: column; }

  /* 标题栏（可拖窗口） */
  .bar {
    -webkit-app-region: drag;
    display: flex; align-items: center; gap: 8px;
    padding: 11px 12px 9px;
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  .bar .title { font-size: 13px; font-weight: 600; letter-spacing: .3px; }
  .bar .sub { color: var(--dim); font-size: 11px; margin-left: auto; }
  .bar button {
    -webkit-app-region: no-drag;
    width: 24px; height: 24px; border-radius: 6px;
    border: 1px solid transparent; background: transparent;
    color: var(--dim); font-size: 15px; line-height: 1; cursor: pointer;
  }
  .bar button:hover { background: rgba(255, 90, 90, .16); color: #ff9b8f; }

  /* 汇总卡片 */
  .summary { display: flex; gap: 8px; padding: 10px 12px 4px; flex: 0 0 auto; }
  .card {
    flex: 1; padding: 9px 11px 10px; border-radius: 10px;
    background: linear-gradient(180deg, var(--card), var(--card-2));
    border: 1px solid var(--line);
  }
  .card .k { color: var(--dim); font-size: 10.5px; margin-bottom: 3px; }
  .card .v { font-size: 19px; font-weight: 700; letter-spacing: .3px; }
  .card .s { color: var(--dim); font-size: 10.5px; margin-top: 2px; }
  .card.hl .v { color: var(--accent); }

  /* 标签页 */
  .tabs { display: flex; gap: 4px; padding: 10px 12px 6px; flex: 0 0 auto; }
  .tabs button {
    padding: 5px 12px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: transparent;
    color: var(--dim); font-size: 11.5px; font-family: inherit;
  }
  .tabs button.on {
    background: rgba(120, 170, 255, .14);
    border-color: rgba(120, 170, 255, .35);
    color: var(--accent);
  }

  /* 表格区 */
  .body { flex: 1 1 auto; overflow-y: auto; padding: 2px 12px 10px; }
  .body::-webkit-scrollbar { width: 8px; }
  .body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 0; z-index: 1;
    background: var(--bg);
    color: var(--dim); font-weight: 500; font-size: 10.5px;
    text-align: right; padding: 5px 5px 6px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  thead th:first-child { text-align: left; }
  tbody td {
    padding: 6px 5px; text-align: right;
    border-bottom: 1px solid rgba(255,255,255,.04);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  tbody td:first-child { text-align: left; color: var(--fg); }
  tbody tr:hover td { background: rgba(120, 170, 255, .06); }
  tbody tr.today td { background: rgba(126, 226, 168, .07); }
  tbody tr.today td:first-child { color: var(--good); font-weight: 600; }
  .cost { color: var(--warn); font-weight: 600; }
  .muted { color: var(--dim); }
  .name { max-width: 150px; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: bottom; }
  .empty { color: var(--dim); text-align: center; padding: 26px 0; font-size: 11.5px; }

  /* 底部说明 */
  .foot {
    flex: 0 0 auto; padding: 8px 12px 10px;
    border-top: 1px solid var(--line);
    color: var(--dim); font-size: 10px; line-height: 1.6;
  }
  .foot b { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
  <div class="bar">
    <span class="title">用量明细</span>
    <span class="sub" id="range">--</span>
    <button id="close" title="关闭">×</button>
  </div>

  <div class="summary">
    <div class="card hl">
      <div class="k">今日花费</div>
      <div class="v" id="todayCost">--</div>
      <div class="s" id="todayTok">--</div>
    </div>
    <div class="card">
      <div class="k">14 天合计</div>
      <div class="v" id="totalCost">--</div>
      <div class="s" id="totalTok">--</div>
    </div>
  </div>

  <div class="tabs">
    <button class="on" data-tab="daily">按天</button>
    <button data-tab="sessions">按会话</button>
  </div>

  <div class="body">
    <table id="dailyTable">
      <thead>
        <tr>
          <th>日期</th><th>调用</th><th>输入</th><th>缓存读</th><th>输出</th><th>费用</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <table id="sessionTable" style="display:none">
      <thead>
        <tr>
          <th>会话</th><th>时间</th><th>调用</th><th>合计</th><th>费用</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="foot">
    按 <b id="modelName">deepseek-flash</b> 官方价：缓存命中 <span id="pIdleHit">0.02</span>／未命中 <span id="pIdleMiss">1</span>／输出 <span id="pIdleOut">4</span> 元每百万（空闲），工作日 9-12、14-18 点按两倍高峰价。法定节假日按工作日近似。
  </div>

  <script src="./usage.js"></script>
</body>
</html>
