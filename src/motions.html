<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>选择动作</title>
<style>
  :root {
    --bg: #10131b;
    --card: #171b26;
    --line: rgba(255, 255, 255, .07);
    --fg: #e8eefc;
    --dim: #8a96ad;
    --accent: #9cc4ff;
    --good: #7ee2a8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    font-size: 12px; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  body { display: flex; flex-direction: column; }

  .bar {
    -webkit-app-region: drag;
    display: flex; align-items: center; gap: 8px;
    padding: 11px 12px 9px; border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  .bar .title { font-size: 13px; font-weight: 600; letter-spacing: .3px; }
  .bar .sub { color: var(--dim); font-size: 11px; margin-left: auto; }
  .bar button {
    -webkit-app-region: no-drag;
    width: 24px; height: 24px; border-radius: 6px;
    border: 1px solid transparent; background: transparent;
    color: var(--dim); font-size: 15px; line-height: 1; cursor: pointer;
  }
  .bar button:hover { background: rgba(255, 90, 90, .16); color: #ff9b8f; }

  .search { padding: 10px 12px 6px; flex: 0 0 auto; display: flex; gap: 8px; }
  .search input {
    flex: 1 1 auto; padding: 8px 11px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card);
    color: var(--fg); font-size: 12px; font-family: inherit; outline: none;
  }
  .search input:focus { border-color: rgba(120, 170, 255, .45); }
  .search input::placeholder { color: var(--dim); }
  .search button {
    flex: 0 0 auto; padding: 0 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid rgba(126, 226, 168, .3); background: rgba(126, 226, 168, .1);
    color: var(--good); font-size: 11.5px; font-family: inherit;
  }
  .search button:hover { background: rgba(126, 226, 168, .18); }

  .body { flex: 1 1 auto; overflow-y: auto; padding: 0 12px 8px; }
  .body::-webkit-scrollbar { width: 8px; }
  .body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 4px; }

  .group {
    color: var(--dim); font-size: 10.5px; letter-spacing: .5px;
    padding: 9px 2px 5px; position: sticky; top: 0; background: var(--bg); z-index: 1;
  }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 9px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent;
  }
  .row:hover { background: rgba(120, 170, 255, .08); }
  .row.playing { background: rgba(126, 226, 168, .1); border-color: rgba(126, 226, 168, .28); }
  .row .label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .key { color: var(--dim); font-size: 10.5px; flex: 0 0 auto; }
  .row.playing .key { color: var(--good); }
  .empty { color: var(--dim); text-align: center; padding: 30px 0; }

  .foot {
    flex: 0 0 auto; padding: 8px 12px 10px; border-top: 1px solid var(--line);
    color: var(--dim); font-size: 10px;
  }
</style>
</head>
<body>
  <div class="bar">
    <span class="title">选择动作</span>
    <span class="sub" id="count">--</span>
    <button id="close" title="关闭">×</button>
  </div>

  <div class="search">
    <input id="q" type="text" placeholder="搜动作名或标识…" autofocus spellcheck="false" />
    <button id="rest">回待机</button>
  </div>

  <div class="body" id="list"></div>

  <div class="foot">点一下立即播放，窗口不关，可以连着试 · Esc 关闭</div>

  <script src="./motions.js"></script>
</body>
</html>
